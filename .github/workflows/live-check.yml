name: Live demo check

# Daily end-to-end test of the deployed demo. A failed run triggers GitHub's normal failure email.
# Once a day only: every run wakes Neon and spends Groq tokens.
# GitHub disables schedules after 60 days without repo activity; re-enable from the Actions tab.
on:
  schedule:
    - cron: "17 3 * * *" # 08:47 IST (off the hour, when GitHub's scheduler is less congested)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-check

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python deploy/live_check.py
