name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff==0.8.4
      - run: ruff check .

  test-python:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, ml_service, ai_service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    env:
      KAFKA_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  integration-postgres:
    name: integration (postgres + least-privilege role)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: finguard
          POSTGRES_USER: finguard
          POSTGRES_PASSWORD: finguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finguard" --health-interval 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: finguard
      POSTGRES_USER: finguard
      POSTGRES_PASSWORD: finguard
      READONLY_DB_PASSWORD: ci-readonly
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations apply cleanly on Postgres
        run: python manage.py migrate --noinput && python manage.py makemigrations --check --dry-run
      - name: Backend tests on Postgres
        run: pytest -q
      - name: Read-only role is least-privilege
        run: python scripts/verify_readonly_role.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  docker:
    name: docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [lint, test-python, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backend, context: backend, file: backend/Dockerfile }
          - { name: ml_service, context: ml_service, file: ml_service/Dockerfile }
          - { name: ai_service, context: ai_service, file: ai_service/Dockerfile }
          - { name: simulator, context: simulator, file: simulator/Dockerfile }
          - { name: frontend, context: frontend, file: frontend/Dockerfile }
          - { name: lite (Render), context: ., file: deploy/lite/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
