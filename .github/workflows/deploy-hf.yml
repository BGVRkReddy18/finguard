name: Deploy to Hugging Face

# After CI passes on main: sync the repo to a Hugging Face Space, which rebuilds the all-in-one image.
# Needs secret HF_TOKEN (write token) and variable HF_SPACE (e.g. username/finguard).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      vars.HF_SPACE != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Assemble Space contents
        run: |
          mkdir -p /tmp/space
          cp -r backend ml_service ai_service simulator frontend /tmp/space/
          mkdir -p /tmp/space/deploy && cp -r deploy/hf /tmp/space/deploy/
          cp deploy/hf/Dockerfile /tmp/space/Dockerfile
          cp deploy/hf/SPACE_README.md /tmp/space/README.md
          cp .dockerignore /tmp/space/
          find /tmp/space -name node_modules -prune -exec rm -rf {} + || true
          du -sh /tmp/space

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "huggingface_hub>=0.26,<1"

      - name: Create Space (first run) and upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python - <<'PY'
          import os, sys
          from huggingface_hub import HfApi
          from huggingface_hub.errors import HfHubHTTPError
          api, space = HfApi(token=os.environ["HF_TOKEN"]), os.environ["HF_SPACE"]
          try:
              if not api.repo_exists(space, repo_type="space"):
                  api.create_repo(space, repo_type="space", space_sdk="docker")
          except HfHubHTTPError as e:  # surface Hugging Face's own explanation (e.g. 402/403 policy errors)
              body = e.response.text if e.response is not None else ""
              sys.exit(f"Could not create the Space: {e}\n{body}\n"
                       "Create it once by hand at https://huggingface.co/new-space (SDK: Docker, hardware: CPU basic)"
                       " and re-run this workflow.")
          if os.environ.get("LLM_API_KEY"):
              api.add_space_secret(space, "LLM_API_KEY", os.environ["LLM_API_KEY"])
          api.upload_folder(repo_id=space, repo_type="space", folder_path="/tmp/space",
                            commit_message=f"Deploy {os.environ.get('GITHUB_SHA', '')[:7]}",
                            delete_patterns=["*"])  # mirror: remove files deleted from the repo
          print(f"Uploaded -> https://huggingface.co/spaces/{space}")
          PY
