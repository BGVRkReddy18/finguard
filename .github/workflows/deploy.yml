name: Deploy

# Runs after CI succeeds on main (or manually). Disabled until the repository variable
# DEPLOY_ENABLED=true is set — see DEPLOY.md for the secrets it needs.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never interrupt a deploy half-way

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}   # pinned host key: no trust-on-first-use
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$USER@$HOST" 'cd ~/finguard && ./deploy/deploy.sh'

      - name: Smoke test
        env:
          HOST: ${{ secrets.DEPLOY_DOMAIN }}
        run: |
          for path in / /api/health/ /ai/health /ml/health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 10 --retry-delay 6 --retry-all-errors "https://$HOST$path")
            echo "$path -> $code"; [ "$code" = 200 ] || exit 1
          done
