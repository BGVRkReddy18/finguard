<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="5">
<title>FinGuard is starting</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f6f4; --ink:#0b0b0b; --muted:#7a7974; --accent:#2a78d6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121211; --ink:#f0efec; --muted:#8f8e86; --accent:#3987e5; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:15px/1.5 system-ui, sans-serif; padding:16px; }
  .card { max-width:420px; text-align:center; }
  .logo { display:inline-grid; place-items:center; width:40px; height:40px; border-radius:10px; background:var(--accent);
          color:#fff; font-weight:700; }
  .spin { width:18px; height:18px; margin:18px auto 0; border:2px solid var(--muted); border-top-color:transparent;
          border-radius:50%; animation:s 1s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  p { color:var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">FG</div>
    <h1 style="font-size:20px;margin:14px 0 4px">FinGuard is starting up</h1>
    <p>Booting Postgres, Kafka, the fraud model and the AI analyst. This usually takes about a minute —
       this page refreshes automatically.</p>
    <div class="spin" aria-hidden="true"></div>
  </div>
</body>
</html>
