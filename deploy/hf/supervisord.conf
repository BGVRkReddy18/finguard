; FinGuard process supervisor. Infra starts first; init.sh then migrates, warms the feature store and
; starts the [group:apps] programs. Everything restarts automatically if it crashes.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ---------- shared program defaults are repeated (supervisord has no inheritance) ----------

[program:caddy]
command=caddy run --config /srv/hf/Caddyfile --adapter caddyfile
priority=1
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:postgres]
command=%(ENV_PGBIN)s/postgres -D %(ENV_PGDATA)s -c listen_addresses=127.0.0.1 -c unix_socket_directories=/tmp -c shared_buffers=128MB -c max_connections=60
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=redis-server --bind 127.0.0.1 --save "" --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:kafka]
command=kafka-server-start.sh /tmp/kafka.properties
; LOG_DIR: Kafka writes its own logs there; the default (/opt/kafka/logs) is not writable as uid 1000
environment=KAFKA_HEAP_OPTS="-Xmx384m -Xms384m",LOG_DIR="/tmp/kafka-logs"
priority=10
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:init]
command=/srv/hf/init.sh
priority=20
autorestart=false
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[group:apps]
programs=backend,ingest,ml,ai,frontend,simulator,janitor

[program:backend]
command=gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 2 --timeout 60
directory=/srv/backend
autostart=false
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:ingest]
command=python manage.py consume_scored
directory=/srv/backend
environment=KAFKA_PUBLISH_EVENTS="true"
autostart=false
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:ml]
command=uvicorn app.main:app --host 127.0.0.1 --port 8001 --log-level warning
directory=/srv/ml_service
autostart=false
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:ai]
command=uvicorn app.main:app --host 127.0.0.1 --port 8002 --log-level warning --proxy-headers --forwarded-allow-ips *
directory=/srv/ai_service
autostart=false
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:frontend]
command=node server.js
directory=/srv/frontend
environment=PORT="3000",HOSTNAME="127.0.0.1",NODE_ENV="production"
autostart=false
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:simulator]
command=python simulator.py
directory=/srv/simulator
autostart=false
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:janitor]
; Data retention for an always-on demo: trim routine (unflagged) transactions hourly
command=sh -c "while true; do sleep 3600; python manage.py prune_transactions --hours 24; done"
directory=/srv/backend
autostart=false
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
